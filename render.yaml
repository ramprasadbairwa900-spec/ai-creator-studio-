services:
  - type: web
    name: ai-creator-studio
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: demo
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: ADMIN_TOKEN
        generateValue: true
